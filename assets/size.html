<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>pico size comparison</title>
    <style>
      :root {
        --bg: #0d0d0e;
        --fg: #ededed;
        --dim: rgba(237, 237, 237, 0.55);
        --mute: rgba(237, 237, 237, 0.35);
        --line: rgba(255, 255, 255, 0.09);
        --bar: rgba(255, 255, 255, 0.18);
        --accent: #4ade80;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 960px;
        padding: 56px 64px 60px;
        box-sizing: border-box;
      }
      .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 40px;
      }
      .title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
          sans-serif;
      }
      .sub {
        font-size: 12px;
        color: var(--mute);
        letter-spacing: 0.04em;
      }
      .row {
        display: grid;
        grid-template-columns: 130px 1fr 110px;
        align-items: center;
        gap: 18px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child {
        border-bottom: none;
      }
      .name {
        font-size: 16px;
        font-weight: 500;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
          sans-serif;
        letter-spacing: -0.01em;
      }
      .name.us {
        color: var(--accent);
        font-weight: 700;
      }
      .track {
        position: relative;
        height: 14px;
      }
      .bar {
        height: 100%;
        background: var(--bar);
        border-radius: 3px;
      }
      .bar.us {
        background: var(--accent);
      }
      .val {
        font-size: 15px;
        text-align: right;
        font-feature-settings: "tnum";
        color: var(--dim);
      }
      .val.us {
        color: var(--accent);
        font-weight: 700;
      }
      .footer {
        margin-top: 36px;
        font-size: 11px;
        color: var(--mute);
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="head">
        <div class="title">macOS installer size</div>
        <div class="sub">May 2026</div>
      </div>

      <div class="row">
        <div class="name">LM Studio</div>
        <div class="track"><div class="bar" style="width: 100%"></div></div>
        <div class="val">556 MB</div>
      </div>

      <div class="row">
        <div class="name">Ollama</div>
        <div class="track">
          <div class="bar" style="width: 28.8%"></div>
        </div>
        <div class="val">160 MB</div>
      </div>

      <div class="row">
        <div class="name">Jan</div>
        <div class="track">
          <div class="bar" style="width: 17.1%"></div>
        </div>
        <div class="val">95 MB</div>
      </div>

      <div class="row">
        <div class="name us">pico</div>
        <div class="track">
          <div class="bar us" style="width: 0.36%"></div>
        </div>
        <div class="val us">2 MB</div>
      </div>

      <div class="footer">
        Sources: lmstudio.ai/download, github.com/ollama/ollama/releases,
        github.com/janhq/jan/releases
      </div>
    </div>
  </body>
</html>
